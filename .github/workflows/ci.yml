name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and end-to-end test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: |
          shellcheck updater.sh host-setup.sh test/run.sh test/host.sh
          # The deploy script that host-setup.sh writes to the server.
          deploy=$(sed -n "/^cat > \"\$lib\/deploy.new\" << 'EOF'\$/,/^EOF\$/p" host-setup.sh | sed '1d;$d')
          test -n "$deploy"
          printf '%s\n' "$deploy" | shellcheck --shell=sh -

      - name: End-to-end test
        run: test/run.sh

      # Installs and removes systemd units on the runner, as on a Debian server.
      - name: Host setup test
        run: sudo test/host.sh
